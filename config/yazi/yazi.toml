# Only what differs from the defaults.

[mgr]
# Parent, current, preview. More room for the preview than the default 1:4:3.
ratio = [1, 3, 4]

[preview]
# The default of 600x900 is blurry on a HiDPI screen.
# After changing these, run: ya cache clear
max_width     = 1500
max_height    = 1800
image_filter  = "lanczos3"
image_quality = 90

[opener]
# One image: imv-dir also loads the rest of its folder. Several: just those.
image = [
  { run = "imv-dir %s", desc = "View", for = "linux", orphan = true },
]

[open]
prepend_rules = [
  { mime = "image/*", use = ["image", "open", "reveal"] },
]
