# Rendered by theme-set from templates/fuzzel.ini. Edit the template, not the output.
[main]
font=MesloLGS Nerd Font:size=13
terminal=ghostty -e
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background={{bg}}ff
text={{fg}}ff
prompt={{accent}}ff
input={{fg}}ff
match={{accent}}ff
selection={{surface}}ff
selection-text={{fg}}ff
selection-match={{accent}}ff
border={{accent}}ff

[border]
width=2
radius=8
