# Rendered by theme-set from templates/hyprlock.conf. Edit the template, not the output.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb({{bg}})
}

label {
    monitor =
    text = $TIME
    color = rgb({{fg}})
    font_size = 72
    font_family = MesloLGS Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    outer_color = rgb({{accent}})
    inner_color = rgb({{surface}})
    font_color = rgb({{fg}})
    check_color = rgb({{yellow}})
    fail_color = rgb({{red}})
    font_family = MesloLGS Nerd Font
    placeholder_text = Password
    fade_on_empty = false
    rounding = 8
    position = 0, -20
    halign = center
    valign = center
}
